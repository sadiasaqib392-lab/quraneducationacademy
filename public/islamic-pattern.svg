<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <style>
      .bg { fill: #fbfbfb; }
      .line { stroke: #d3d3d3; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .line-soft { stroke: #e3e3e3; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>
  <rect width="160" height="160" class="bg"/>
  
  <!-- Central 8-pointed star & interlocking strapwork tile -->
  <!-- Center: 80, 80 -->
  <!-- 8-pointed star constructed with 2 intersecting squares (size 40, rotated 45) -->
  <polygon points="80,50 89,71 110,80 89,89 80,110 71,89 50,80 71,71" class="line" />
  
  <!-- Interlocking geometric strapwork lines extending outwards -->
  <!-- Diagonals to corners and edges -->
  <path d="M 80,50 L 80,0" class="line" />
  <path d="M 80,110 L 80,160" class="line" />
  <path d="M 50,80 L 0,80" class="line" />
  <path d="M 110,80 L 160,80" class="line" />

  <!-- Diagonal interlacing lines -->
  <path d="M 71,71 L 20,20 L 0,40 M 20,20 L 40,0" class="line" />
  <path d="M 89,71 L 140,20 L 160,40 M 140,20 L 120,0" class="line" />
  <path d="M 71,89 L 20,140 L 0,120 M 20,140 L 40,160" class="line" />
  <path d="M 89,89 L 140,140 L 160,120 M 140,140 L 120,160" class="line" />

  <!-- Corner stars (at 0,0 160,0 0,160 160,160) -->
  <path d="M 0,30 L 9,9 L 30,0" class="line" />
  <path d="M 160,30 L 151,9 L 130,0" class="line" />
  <path d="M 0,130 L 9,151 L 30,160" class="line" />
  <path d="M 160,130 L 151,151 L 130,160" class="line" />

  <!-- Mid-edge intersections -->
  <polygon points="0,70 10,80 0,90" class="line" />
  <polygon points="160,70 150,80 160,90" class="line" />
  <polygon points="70,0 80,10 90,0" class="line" />
  <polygon points="70,160 80,150 90,160" class="line" />

  <polygon points="40,0 80,40 40,80 0,40" class="line-soft" />
  <polygon points="120,0 160,40 120,80 80,40" class="line-soft" />
  <polygon points="40,80 80,120 40,160 0,120" class="line-soft" />
  <polygon points="120,80 160,120 120,160 80,120" class="line-soft" />
</svg>
